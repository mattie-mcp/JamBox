<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 400 440" width="400" height="440" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <rect x="-20" y="-10" width="400" height="440" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
  <text x="0" y="12" font-size="15" font-weight="bold" fill="#222">Concept C — "Jam Bot" · front, mm</text>
  <!-- cartridge -->
  <rect x="120" y="40" width="80" height="48" rx="8" fill="#e76f51" stroke="#2b2b2b" stroke-width="1.5"/>
  <path d="M160 52 a8 8 0 1 1 0.1 0" fill="#fff3ef" stroke="#8a3a28"/>
  <!-- body -->
  <rect x="40" y="80" width="240" height="300" rx="28" fill="#cfe3e8" stroke="#2b2b2b" stroke-width="1.5"/>
  <rect x="112" y="80" width="96" height="8" fill="#3a3a3a"/>
  <!-- forehead buttons -->
  <circle cx="120" cy="108" r="13" fill="#3d7bd9" stroke="#1d3f73" stroke-width="2"/>
  <circle cx="160" cy="108" r="15" fill="#3fb36b" stroke="#1e6a3d" stroke-width="2"/>
  <circle cx="200" cy="108" r="13" fill="#f08a24" stroke="#8a4a0c" stroke-width="2"/>
  <!-- eyes = speakers -->
  <circle cx="100" cy="180" r="46" fill="#ffffff" stroke="#2b2b2b" stroke-width="4"/>
  <circle cx="220" cy="180" r="46" fill="#ffffff" stroke="#2b2b2b" stroke-width="4"/>
  <g fill="#333" id="eye"><circle cx="100" cy="180" r="3"/><circle cx="88" cy="180" r="3"/><circle cx="112" cy="180" r="3"/><circle cx="76" cy="180" r="3"/><circle cx="124" cy="180" r="3"/><circle cx="94" cy="169" r="3"/><circle cx="106" cy="169" r="3"/><circle cx="82" cy="169" r="3"/><circle cx="118" cy="169" r="3"/><circle cx="94" cy="191" r="3"/><circle cx="106" cy="191" r="3"/><circle cx="82" cy="191" r="3"/><circle cx="118" cy="191" r="3"/><circle cx="100" cy="158" r="3"/><circle cx="88" cy="158" r="3"/><circle cx="112" cy="158" r="3"/><circle cx="100" cy="202" r="3"/><circle cx="88" cy="202" r="3"/><circle cx="112" cy="202" r="3"/></g>
  <use href="#eye" x="120"/>
  <!-- nose knob -->
  <circle cx="160" cy="238" r="19" fill="#e9c46a" stroke="#6b4e10" stroke-width="2"/>
  <path d="M160 222v8" stroke="#6b4e10" stroke-width="3"/>
  <!-- mouth matrix 8x16 -->
  <rect x="89" y="272" width="142" height="71" rx="10" fill="#1d1630" stroke="#2b2b2b"/>
  <g fill="#ff5fa2"><rect x="96" y="304" width="7" height="8"/><rect x="105" y="298" width="7" height="20"/><rect x="114" y="292" width="7" height="32"/><rect x="123" y="286" width="7" height="44"/><rect x="132" y="294" width="7" height="28"/><rect x="141" y="282" width="7" height="52"/><rect x="150" y="290" width="7" height="36"/><rect x="159" y="284" width="7" height="48"/><rect x="168" y="292" width="7" height="32"/><rect x="177" y="286" width="7" height="44"/><rect x="186" y="296" width="7" height="24"/><rect x="195" y="290" width="7" height="36"/><rect x="204" y="300" width="7" height="16"/><rect x="213" y="304" width="7" height="8"/></g>
  <!-- feet -->
  <rect x="60" y="380" width="60" height="12" rx="4" fill="#333"/><rect x="200" y="380" width="60" height="12" rx="4" fill="#333"/>
  <path d="M40 410H280" stroke="#555" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="160" y="405" text-anchor="middle" fill="#555">240</text>
  <path d="M300 80V380" stroke="#555" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="304" y="230" fill="#555">300</text>
  <text x="304" y="244" fill="#555">(200 deep)</text>
  <text x="212" y="60" fill="#333" font-size="10.5">"feed me"</text>
</svg>
